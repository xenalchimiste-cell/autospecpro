<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AutoSpec PRO | Central Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--accent)"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      AUTOSPEC <span>PRO</span>
    </div>
    <div class="nav-tabs">
      <div class="tab active" onclick="showPage('search')">Identification</div>
      <div class="tab" onclick="showPage('compare')">Comparatif</div>
      <div class="tab" onclick="showPage('plans')">Abonnements</div>
    </div>
  </header>

  <main>
    <!-- PAGE : SEARCH -->
    <div id="page-search" class="page active">
      <div class="search-orb">
        <div class="search-field">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="vrm-input" placeholder="PLAQUE D'IMMATRICULATION..." autocomplete="off" spellcheck="false"/>
        </div>
        <button class="search-btn" onclick="doSearch()">ANALYSER</button>
      </div>

      <div id="results-engine">
        <!-- Dashboard injecté -->
        <div style="text-align:center; padding:5rem; opacity:0.3;">
          <p style="font-family:var(--font-mono); font-size:12px; letter-spacing:0.2em;">SYSTEM READY // AWAITING INPUT</p>
        </div>
      </div>
    </div>

    <!-- OTHER PAGES -->
    <div id="page-compare" class="page">
      <div class="grid-item" style="text-align:center; padding:5rem;">
        <p style="font-family:var(--font-mono); color:var(--accent);">ERROR 403: MODULE REQUIRES PRO SUBSCRIPTION</p>
      </div>
    </div>
  </main>

  <div class="mobile-nav">
    <button class="m-tab active" onclick="showPage('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>SEARCH</span>
    </button>
    <button class="m-tab" onclick="showPage('compare')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>
      <span>COMPARE</span>
    </button>
    <button class="m-tab" onclick="showPage('plans')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span>Tier</span>
    </button>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
